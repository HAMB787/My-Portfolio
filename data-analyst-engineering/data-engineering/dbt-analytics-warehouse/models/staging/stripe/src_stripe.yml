version: 2

sources:
  - name: stripe
    project: ritualanalyitcs
    dataset: fivetran_stripe
    description: This dataset contains the data from Stripe, ingested through Fivetran.
    freshness:
      error_after:
        count: 24
        period: hour
    loaded_at_field: _fivetran_synced    

    tables:
      - name: invoice
      - name: customer
      - name: charge
      - name: subscription_history
      - name: product
      - name: subscription_item
      - name: plan
      - name: payment_method
      - name: promotion_code
      - name: dispute
        freshness: 
          error_after:
            count: 15
            period: day         
      - name: refund
        freshness: 
          error_after:
            count: 15
            period: day         
      - name: coupon
        freshness: 
          error_after:
            count: 15
            period: day         