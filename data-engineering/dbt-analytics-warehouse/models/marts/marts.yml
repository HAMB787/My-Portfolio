version: 2

models:
  - name: fct_platform_events
    description: All platform events performed by members
    columns:
      - name: id
        description: Unique id of the event
        tests:
          - unique
          - not_null

      - name: anonymous_id
        description: Visitor id of the event created by Segment, before user becomes a member on Platform

      - name: created_at
        description: Timestamp the event was performed
        tests:
          - not_null

      - name: user_id
        description: Id of the user, corresponding to uuid in Postgre members source

      - name: original_event_name
        description: Name of the original event
        tests:
          - not_null

      - name: event_name
        description: Name of the actual event, some of the events are renamed according to click id-s
        tests:
          - not_null

      - name: is_activity
        description: Whether the event is considered an activity or not
        tests:
          - not_null

      - name: is_visitor
        description: Whether the event performer is considered a visitor or registered user
        tests:
          - not_null

      - name: page_path
        description: Path of the page

      - name: page_title
        description: Title of the page

      - name: utm_source
        description: UTM source of the page

      - name: utm_campaign
        description: UTM campaign of the page

      - name: utm_term
        description: UTM term of the page

      - name: utm_content
        description: UTM content of the page

      - name: utm_medium
        description: UTM medium of the page


  - name: dim_expert
    description: "This table contains details about experts including personal information, rates, and statuses."
    columns:
      - name: id
        description: "A unique identifier for each expert."
        tests:
          - unique
          - not_null

      - name: uuid
        description: "A unique universal identifier for each expert."
        tests:
          - unique
          - not_null

      - name: first_name
        description: "The first name of the expert."
        tests:
          - not_null

      - name: last_name
        description: "The last name of the expert."
        tests:
          - not_null

      - name: full_name
        description: "The full name of the expert."
        tests:
          - not_null

      - name: email
        description: "The email address of the expert."
        tests:
          - not_null
          - unique

      - name: phone_number
        description: "The phone number of the expert."
        tests:
          - not_null

      - name: schedule_link
        description: "A link to the expert's schedule."

      - name: expert_type
        description: "The type of expert."
        tests:
          - accepted_values:
              values: ['Human', 'Bot'] 

      - name: hourly_rate
        description: "The hourly rate charged by the expert."

      - name: multiplier
        description: "A multiplier factor for calculating rates under certain conditions."

      - name: onboarding_hours
        description: "The number of hours dedicated to onboarding."

      - name: pathway_rate
        description: "Special rate for certain pathways."

      - name: supervisee_rate
        description: "Rate for supervisee sessions."

      - name: supervisor_rate
        description: "Rate for supervisor sessions."

      - name: currency
        description: "The currency in which rates are calculated."

      - name: contract_status
        description: "The current contract status of the expert."
        tests:
          - accepted_values:
              values: ['Active', 'Inactive']

      - name: created_at
        description: "The timestamp when the expert record was created."
        tests:
          - not_null

      - name: updated_at
        description: "The timestamp when the expert record was last updated."
        tests:
          - not_null

      - name: is_deleted
        description: "A boolean indicating if the expert record has been logically deleted."
        tests:
          - not_null

      - name: fivetran_synced_at
        description: "The timestamp of the last sync with Fivetran."
        tests:
          - not_null


  - name: dim_member
    description: "This table contains details about members, including personal information, their status within the system, and their association with experts."
    columns:
      - name: id
        description: "A unique identifier for each member."
        tests:
          - unique
          - not_null

      - name: uuid
        description: "A unique universal identifier for each member."
        tests:
          - unique
          - not_null

      - name: first_name
        description: "The first name of the member."
        tests:
          - not_null

      - name: last_name
        description: "The last name of the member."
        tests:
          - not_null

      - name: full_name
        description: "The full name of the member."
        tests:
          - not_null

      - name: gender
        description: "The gender of the member."

      - name: email
        description: "The email address of the member."
        tests:
          - not_null
          - unique

      - name: phone_number
        description: "The phone number of the member."

      - name: expert_id
        description: "The unique identifier for the associated expert."
        tests:
          - not_null

      - name: expert_first_name
        description: "The first name of the associated expert."
        tests:
          - not_null

      - name: expert_last_name
        description: "The last name of the associated expert."
        tests:
          - not_null

      - name: expert_full_name
        description: "The full name of the associated expert."
        tests:
          - not_null

      - name: member_status
        description: "The current status of the member."
        tests:
          - accepted_values:
              values: ['Active', 'Inactive', 'Disabled', 'Verified', 'Unverified', 'Verification Pending']

      - name: member_app_status
        description: "The status of the member within the application."
        tests:
          - accepted_values:
              values: ['Active', 'Inactive', 'Onboarding']

      - name: member_funnel
        description: "The funnel stage of the member."
        tests:
          - accepted_values:
              values: ['Tiers_v1', 'Church']        

      - name: member_push_notification_status
        description: "The status of push notifications for the member."
        tests:
          - accepted_values:
              values: ['Unknown', 'Denied', 'Accepted']

      - name: member_tier
        description: "The membership tier of the member."
        tests:
          - accepted_values:
              values: ['Digital First', 'Hybrid', 'Expert-led Journey', 'Couples', 'Couples biweekly']

      - name: primary_member_id
        description: "The unique identifier for the primary member, in case of linked accounts."

      - name: module_id
        description: "The unique identifier for the module assigned to the member."

      - name: account_id
        description: "The unique identifier for the member's account."

      - name: member_timezone
        description: "The timezone of the member."

      - name: member_country
        description: "The country of the member."

      - name: subscription_created_at
        description: "The datetime when member created a subscription."

      - name: subscription_billing_type
        description: "Whether the subscription is monthly or 28-day"
        tests:
          - not_null
          - accepted_values:
              values: ['Monthly', '28-day']
          
      - name: initial_utm_campaign
        description: UTM campaign we first see for the member/visitor

      - name: initial_utm_content
        description: UTM content we first see for the member/visitor

      - name: initial_utm_medium
        description: UTM medium we first see for the member/visitor

      - name: initial_utm_source
        description: UTM source we first see for the member/visitor

      - name: utm_campaign
        description: Last UTM campaign we see for the member/visitor before first subscription

      - name: utm_content
        description: Last UTM content we see for the member/visitor before first subscription

      - name: utm_medium
        description: Last UTM medium we see for the member/visitor before first subscription

      - name: utm_source
        description: Last UTM source we see for the member/visitor before first subscription

      - name: created_at
        description: "The timestamp when the member record was created."
        tests:
          - not_null

      - name: updated_at
        description: "The timestamp when the member record was last updated."
        tests:
          - not_null

      - name: is_deleted
        description: "A boolean indicating if the member record has been logically deleted."
        tests:
          - not_null

      - name: fivetran_synced_at
        description: "The timestamp of the last sync with Fivetran."
        tests:
          - not_null


  - name: fct_webapp_sessions
    description: "This table logs sessions within the web application, tracking their status, type, and relationships to members and experts."
    columns:
      - name: id
        description: "A unique identifier for each session."
        tests:
          - unique
          - not_null

      - name: uuid
        description: "A unique universal identifier for each session."
        tests:
          - unique
          - not_null

      - name: member_id
        description: "The unique identifier for the member associated with the session."

      - name: expert_id
        description: "The unique identifier for the expert associated with the session."

      - name: parent_session_id
        description: "The unique identifier for the parent session, if applicable."

      - name: session_status
        description: "The status of the session."
        tests:
          - accepted_values:
              values: ['Ongoing', 'Ended', 'Scheduled', 'Canceled', 'Rescheduled']

      - name: session_type
        description: "The type of the session."
        tests:
          - accepted_values:
              values: ['Chat', 'Habit Tracking', 'Checkin', 'Welcome', 'Individual', 'Group', 'Supervisor', 'Supervised']

      - name: session_ended_at
        description: "The timestamp when the session ended."

      - name: next_session_at
        description: "The timestamp for the next scheduled session, if any."

      - name: next_session_event_id
        description: "The unique identifier for the event of the next session."

      - name: next_session_invitee_id
        description: "The unique identifier for the invitee of the next session."

      - name: created_at
        description: "The timestamp when the session record was created."
        tests:
          - not_null

      - name: updated_at
        description: "The timestamp when the session record was last updated."
        tests:
          - not_null

      - name: is_deleted
        description: "A boolean indicating if the session record has been logically deleted."
        tests:
          - not_null

      - name: fivetran_synced_at
        description: "The timestamp of the last sync with Fivetran."
        tests:
          - not_null

  - name: fct_daily_ad_spend
    description: This table shows total ad spend by date
    columns:
      - name: unique_id
        description: Unique identifier of the record
        tests:
          - unique
          - not_null  

      - name: date
        description: Date of the ad spend
        tests:
          - not_null  

      - name: utm_source
        description: Date of the ad spend
        tests:
          - not_null            

      - name: utm_campaign
        description: Date of the ad spend
        tests:
          - not_null                     

      - name: utm_medium
        description: Date of the ad spend
        tests:
          - not_null            

      - name: total_cost
        description: Total cost of ad spend in that day
        tests:
          - not_null 


  - name: fct_invoices
    description: "This table contains detailed invoice records, including billing information, customer details, charge and subscription data, and various timestamps indicating the lifecycle of an invoice."
    columns:
      - name: id
        description: "Unique identifier for each invoice record."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identifier for the customer associated with the invoice."
        tests:
          - not_null        

      - name: charge_id
        description: "Unique identifier for the charge associated with the invoice."

      - name: subscription_id
        description: "Unique identifier for the subscription associated with the invoice."

      - name: billing
        description: "Billing mode used for the invoice."

      - name: billing_reason
        description: "Reason why the invoice was generated."

      - name: currency
        description: "Currency in which the invoice is denominated."

      - name: invoice_number
        description: "The invoice number."

      - name: invoice_status
        description: "Current status of the invoice."

      - name: invoice_amount_due
        description: "The total amount due on the invoice."

      - name: invoice_amount_paid
        description: "The amount that has been paid towards the invoice."

      - name: invoice_amount_remaining
        description: "The remaining amount that is due on the invoice."

      - name: invoice_subtotal
        description: "The subtotal of the invoice before taxes and adjustments."

      - name: invoice_total
        description: "The total amount of the invoice after taxes and adjustments."

      - name: is_attempted
        description: "Flag indicating whether a payment attempt has been made for this invoice."

      - name: is_auto_advance
        description: "Flag indicating whether the invoice will automatically advance to the next billing period."

      - name: is_deleted
        description: "Flag indicating whether the invoice record has been marked as deleted."

      - name: is_livemode
        description: "Flag indicating whether the invoice was created in live mode."

      - name: is_paid
        description: "Flag indicating whether the invoice has been fully paid."

      - name: is_test
        description: "Flag indicating whether the invoice was created in test mode."

      - name: created_at
        description: "Timestamp when the invoice was created."
        tests:
          - not_null        

      - name: invoiced_at
        description: "Timestamp when the invoice was issued."

      - name: last_updated_at
        description: "The last timestamp when the invoice was updated."

      - name: customer_email
        description: "Email address of the customer."

      - name: customer_name
        description: "Name of the customer."

      - name: customer_uuid
        description: "Unique identifier for the customer."

      - name: customer_funnel
        description: "The funnel through which the customer was acquired."

      - name: customer_funnel_start
        description: "Starting point of the customer funnel."

      - name: customer_funnel_id
        description: "Unique identifier for the customer's funnel."

      - name: customer_coupon
        description: "Coupon code used by the customer."

      - name: customer_rfsn
        description: "Referral source for the customer."

      - name: customer_rfsn_v4_aid
        description: "Version 4 aid of the customer referral source."

      - name: customer_rfsn_v4_cs
        description: "Version 4 cs of the customer referral source."

      - name: customer_rfsn_v4_id
        description: "Version 4 id of the customer referral source."

      - name: customer_tier_type
        description: "Tier type of the customer."

      - name: customer_utm_campaign
        description: "UTM campaign parameter for the customer."

      - name: customer_utm_content
        description: "UTM content parameter for the customer."

      - name: customer_utm_medium
        description: "UTM medium parameter for the customer."

      - name: customer_utm_source
        description: "UTM source parameter for the customer."

      - name: customer_is_deleted
        description: "Flag indicating whether the customer has been marked as deleted."

      - name: charge_billing_country
        description: "Billing country associated with the charge."

      - name: charge_description
        description: "Description of the charge."

      - name: charge_failure_code
        description: "Failure code associated with the charge if it failed."

      - name: charge_failure_message
        description: "Failure message associated with the charge if it failed."

      - name: charge_outcome_network_status
        description: "Network status of the charge outcome."

      - name: charge_outcome_seller_message
        description: "Seller message related to the charge outcome."

      - name: charge_status
        description: "Status of the charge."

      - name: charge_amount
        description: "Amount of the charge."

      - name: charge_amount_refunded
        description: "Amount refunded from the charge."

      - name: charge_is_captured
        description: "Flag indicating whether the charge has been captured."

      - name: charge_is_livemode
        description: "Flag indicating whether the charge was created in live mode."

      - name: charge_is_paid
        description: "Flag indicating whether the charge has been paid."

      - name: charge_is_refunded
        description: "Flag indicating whether the charge has been refunded."

      - name: subscription_created_at
        description: "Timestamp when the subscription was created."

      - name: subscription_trial_started_at
        description: "Timestamp when the trial period for the subscription started."

      - name: subscription_trial_ended_at
        description: "Timestamp when the trial period for the subscription ended."

      - name: subscription_started_at
        description: "Timestamp when the subscription officially started."

      - name: subscription_current_period_start_at
        description: "Timestamp marking the start of the current billing period for the subscription."

      - name: subscription_current_period_end_at
        description: "Timestamp marking the end of the current billing period for the subscription."

      - name: subscription_status
        description: "Current status of the subscription."

      - name: subscription_canceled_at
        description: "Timestamp when the subscription was canceled."

      - name: subscription_expired_at
        description: "Timestamp when the subscription expired."

      - name: subscription_is_expired_at_period_end
        description: "Flag indicating whether the subscription is set to expire at the end of the current period."

      - name: subscription_ended_at
        description: "Timestamp when the subscription ended."

      - name: refund_id
        description: "Unique identifier for the refund record."
        tests:
          - unique

      - name: refund_currency
        description: "Currency in which the refund was issued."

      - name: refund_description
        description: "Description of the refund."

      - name: refund_failure_reason
        description: "Reason for refund failure, if applicable."

      - name: refund_reason
        description: "Reason for issuing the refund."

      - name: refund_status
        description: "Current status of the refund (e.g., pending, completed, failed)."

      - name: refund_amount
        description: "Amount of the refund issued."

      - name: refund_initiated_at
        description: "Timestamp when the refund was initiated."

      - name: refund_type
        description: "Timestamp when the refund was initiated."
        tests:
          - accepted_values:
              values: ['Partial', 'Full']

      - name: dispute_id
        description: "Unique identifier for the dispute record."
        tests:
          - unique

      - name: dispute_currency
        description: "Currency in which the dispute amount is denominated."

      - name: dispute_reason
        description: "Reason for the dispute."

      - name: dispute_status
        description: "Current status of the dispute (e.g., pending, resolved, closed)."

      - name: dispute_amount
        description: "Amount involved in the dispute."

      - name: dispute_created_at
        description: "Timestamp when the dispute was created."        


  - name: fct_subscriptions
    description: "This table contains detailed records of subscriptions, including subscription items, plans, products, customer details, and subscription lifecycle timestamps."
    columns:
      - name: subscription_id
        description: "Unique identifier for each subscription."
        tests:
          - unique
          - not_null

      - name: subscription_item_id
        description: "Identifier for the item within the subscription."

      - name: plan_id
        description: "Identifier for the plan associated with the subscription."

      - name: product_id
        description: "Identifier for the product associated with the subscription."

      - name: customer_id
        description: "Identifier for the customer who owns the subscription."
        tests:
          - not_null        

      - name: subscription_created_at
        description: "Timestamp when the subscription was created."
        tests:
          - not_null        

      - name: subscription_trial_started_at
        description: "Timestamp when the trial period for the subscription started."

      - name: subscription_trial_ended_at
        description: "Timestamp when the trial period for the subscription ended."

      - name: subscription_started_at
        description: "Timestamp when the subscription officially started."

      - name: subscription_current_period_start_at
        description: "Timestamp marking the start of the current billing period for the subscription."

      - name: subscription_current_period_end_at
        description: "Timestamp marking the end of the current billing period for the subscription."

      - name: subscription_status
        description: "Current status of the subscription."

      - name: subscription_canceled_at
        description: "Timestamp when the subscription was canceled."

      - name: subscription_expired_at
        description: "Timestamp when the subscription expired."

      - name: subscription_is_expired_at_period_end
        description: "Flag indicating whether the subscription is set to expire at the end of the current period."

      - name: subscription_ended_at
        description: "Timestamp when the subscription ended."

      - name: subscription_pause_collection_behavior
        description: "Subscription pause behavior"

      - name: subscription_pause_collection_resumes_at
        description: "Subscription pause resuming timestamp"

      - name: customer_email
        description: "Email address of the customer."

      - name: customer_name
        description: "Name of the customer."

      - name: customer_uuid
        description: "Unique identifier for the customer."

      - name: customer_funnel
        description: "The funnel through which the customer was acquired."

      - name: customer_funnel_start
        description: "Starting point of the customer funnel."

      - name: customer_funnel_id
        description: "Unique identifier for the customer's funnel."

      - name: customer_coupon
        description: "Coupon code used by the customer."

      - name: customer_rfsn
        description: "Referral source for the customer."

      - name: customer_rfsn_v4_aid
        description: "Version 4 aid of the customer referral source."

      - name: customer_rfsn_v4_cs
        description: "Version 4 cs of the customer referral source."

      - name: customer_rfsn_v4_id
        description: "Version 4 id of the customer referral source."

      - name: customer_tier_type
        description: "Tier type of the customer."

      - name: customer_utm_campaign
        description: "UTM campaign parameter for the customer."

      - name: customer_utm_content
        description: "UTM content parameter for the customer."

      - name: customer_utm_medium
        description: "UTM medium parameter for the customer."

      - name: customer_utm_source
        description: "UTM source parameter for the customer."

      - name: customer_is_deleted
        description: "Flag indicating whether the customer has been marked as deleted."

      - name: plan_duration
        description: "Duration of the plan."

      - name: plan_name
        description: "Name of the plan."

      - name: plan_trial_period_days
        description: "Number of trial period days offered with the plan."

      - name: plan_is_active
        description: "Flag indicating whether the plan is currently active."

      - name: product_name
        description: "Name of the product associated with the subscription."

      - name: product_description
        description: "Description of the product."

      - name: product_is_active
        description: "Flag indicating whether the product is currently active."


  - name: fct_wistia_events
    description: "This table records events related to media views within Wistia, tracking detailed viewer interaction data, including geographical location, device, and media information."
    columns:
      - name: visitor_id
        description: "Unique identifier for the visitor who interacted with the media."

      - name: media_id
        description: "Identifier for the media that was interacted with."

      - name: event_id
        description: "Unique identifier for the specific event."

      - name: received_at
        description: "Timestamp when the event was received."

      - name: ip
        description: "IP address of the visitor."

      - name: country
        description: "Country from which the event was generated."

      - name: region
        description: "Region from which the event was generated."

      - name: city
        description: "City from which the event was generated."

      - name: org
        description: "Organization associated with the IP address of the visitor."

      - name: email
        description: "Email address of the visitor, if available."

      - name: embed_url
        description: "URL of the page where the media was embedded."

      - name: conversion_type
        description: "Type of conversion event triggered by the visitor."

      - name: conversion_data
        description: "Data related to the conversion event."

      - name: iframe_heatmap_url
        description: "URL of the iframe heatmap generated for the media view."

      - name: browser
        description: "Browser used by the visitor."

      - name: browser_version
        description: "Version of the browser used by the visitor."

      - name: platform
        description: "Operating system platform of the visitor's device."

      - name: media_name
        description: "Name of the media."

      - name: media_url
        description: "URL of the media."

      - name: thumbnail_url
        description: "URL of the media thumbnail image."

      - name: thumbnail_contentType
        description: "Content type of the thumbnail image."

      - name: thumbnail_type
        description: "Type of the thumbnail image."

      - name: lat
        description: "Latitude coordinate from which the event was generated."

      - name: lon
        description: "Longitude coordinate from which the event was generated."

      - name: percent_viewed
        description: "Percentage of the media that was viewed."

      - name: is_mobile
        description: "Flag indicating whether the event was generated from a mobile device."

      - name: thumbnail_width
        description: "Width of the thumbnail image."

      - name: thumbnail_height
        description: "Height of the thumbnail image."

      - name: thumbnail_fileSize
        description: "File size of the thumbnail image."

      - name: last_updated_at
        description: "The last timestamp when the event record was updated."

      - name: uuid
        description: "Unique identifier for the member."


  - name: fct_questionnaire_answers
    description: "A table containing responses to various questionnaire forms with detailed metadata."
    columns:
      - name: unique_sk
        description: "A unique surrogate key for each record."
        tests:
          - unique
          - not_null

      - name: survey_started_at
        description: "Timestamp marking when the survey was started."
        tests:
          - not_null

      - name: surver_submitted_at
        description: "Timestamp marking when the survey was submitted."

      - name: participant_email
        description: "Email address of the survey participant."

      - name: field_id
        description: "Identifier for the specific field in the form."

      - name: form_id
        description: "Identifier for the form."

      - name: form_title
        description: "Title of the form."

      - name: form_type
        description: "Type of the form."

      - name: workspace_name
        description: "Name of the workspace where the form is hosted."

      - name: question_title
        description: "Title of the question asked in the form."

      - name: question_type
        description: "Type of the question."

      - name: response_id
        description: "Identifier for the participant's response."

      - name: answer_type
        description: "Type of answer provided."

      - name: generalized_answer
        description: "Generalized form of the answer."

      - name: date_answer
        description: "Date form of the answer when applicable."

      - name: text_answer
        description: "Textual answer provided by the participant."

      - name: number_answer
        description: "Numerical answer provided by the participant."

      - name: true_false_answer
        description: "Boolean answer provided by the participant."

      - name: phone_number_answer
        description: "Phone number provided by the participant if applicable."

      - name: email_answer
        description: "Email answer provided by the participant."

      - name: url_answer
        description: "URL provided by the participant as an answer."

      - name: file_url_answer
        description: "File URL provided by the participant as an answer."

      - name: choice_texts
        description: "Texts of the choices provided in a multiple-choice question."

      - name: choice_answers
        description: "Answers selected by the participant in a multiple-choice question."

      - name: aid
        description: "Assistance identifier if applicable."

      - name: expert_id
        description: "Identifier of the expert or admin who might have interacted with the form."

      - name: fbclid
