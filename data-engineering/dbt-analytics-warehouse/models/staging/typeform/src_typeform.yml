version: 2

sources:
  - name: typeform
    project: ritualanalyitcs
    dataset: fivetran_typeform
    description: This dataset contains the data from Typeform, ingested through Fivetran.
    freshness:
      error_after:
        count: 24
        period: hour
    loaded_at_field: _fivetran_synced     

    tables:
      - name: response
      - name: response_answer
      - name: workspace
      - name: theme
      - name: workspace_member
      - name: form_history
        freshness: 
          error_after:
            count: 30
            period: day               
      - name: form_field_history
        freshness: 
          error_after:
            count: 30
            period: day               
      - name: response_answer_choice
      - name: form_field_choice_history
        freshness: 
          error_after:
            count: 30
            period: day               